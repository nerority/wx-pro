<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="Multi-model pro weather: compare forecast models side by side for any US location.">
<title>WX Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <button class="place-btn" id="placeBtn" aria-label="Change place">
    <span class="place-name" id="placeName">—</span>
    <span class="place-sub" id="placeSub"></span>
  </button>
  <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
  </button>
</header>

<main id="main">
  <section id="view-now" class="view"></section>
  <section id="view-compare" class="view" hidden></section>
  <section id="view-radar" class="view" hidden></section>
  <section id="view-alerts" class="view" hidden></section>
  <section id="view-skill" class="view" hidden></section>
  <section id="view-places" class="view" hidden></section>
</main>

<nav class="tabbar" aria-label="Sections">
  <a href="#now" data-tab="now" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 1 3h-2l1-3zm0 20-1-3h2l-1 3zM2 12l3-1v2l-3-1zm20 0-3 1v-2l3 1zM4.9 4.9l2.8 1.4-1.4 1.4-1.4-2.8zm14.2 14.2-2.8-1.4 1.4-1.4 1.4 2.8zM4.9 19.1l1.4-2.8 1.4 1.4-2.8 1.4zM19.1 4.9l-1.4 2.8-1.4-1.4 2.8-1.4z"/></svg>
    <span>Now</span>
  </a>
  <a href="#compare" data-tab="compare" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 17l5-6 4 3 4-7 5 5M3 21h18"/></svg>
    <span>Compare</span>
  </a>
  <a href="#radar" data-tab="radar" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 12l6-6M12 3a9 9 0 1 0 9 9M12 7a5 5 0 1 0 5 5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
    <span>Radar</span>
  </a>
  <a href="#alerts" data-tab="alerts" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 1 21h22L12 2zm1 16h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
    <span>Alerts</span>
  </a>
  <a href="#skill" data-tab="skill" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 3h10v2h4v3a5 5 0 0 1-4.6 5A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 7.6 13 5 5 0 0 1 3 8V5h4V3zm0 4H5v1a3 3 0 0 0 2 2.8V7zm10 0v3.8A3 3 0 0 0 19 8V7h-2z"/></svg>
    <span>Accuracy</span>
  </a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="radar.js"></script>
<script src="skill.js"></script>
<script src="app.js"></script>
</body>
</html>
